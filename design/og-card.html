<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: Poppins; src: url('../public/assets/fonts/poppins-400.woff2'); font-weight: 400; }
      @font-face { font-family: Poppins; src: url('../public/assets/fonts/poppins-600.woff2'); font-weight: 600; }
      @font-face { font-family: Poppins; src: url('../public/assets/fonts/poppins-700.woff2'); font-weight: 700; }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: center;
        gap: 64px;
        padding: 64px 72px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: Poppins, Arial, sans-serif;
      }
      .mark { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; font-size: 22px; font-weight: 600; }
      .mark img { width: 44px; height: 44px; }
      .mark small { display: block; color: #5f5f67; font-size: 16px; font-weight: 400; }
      h1 { margin: 0; font-size: 62px; font-weight: 700; letter-spacing: -2.4px; line-height: 1.06; }
      h1 span { background: linear-gradient(100deg, #fe6604, #ee0979); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { margin: 28px 0 0; color: #3f3f46; font-size: 22px; line-height: 1.5; }
      .portrait { width: 360px; height: 470px; overflow: hidden; border-radius: 24px; }
      .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
    </style>
  </head>
  <body>
    <div>
      <div class="mark"><img src="../public/assets/n3tz-mark.svg" alt="" /><div>Tarik Ermis<small>tarikermis.com</small></div></div>
      <h1>Ich helfe dir, endlich wieder <span>Zeit</span> für deinen Betrieb zu haben.</h1>
      <p>Für Handwerk und kleine Betriebe. Völklingen, Saarland.</p>
    </div>
    <div class="portrait"><img src="../public/assets/tarik-2026-09-720.webp" alt="" /></div>
  </body>
</html>
